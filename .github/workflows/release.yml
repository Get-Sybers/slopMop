name: Release

# Builds the Windows binary from any branch and keeps it with the run. With
# `publish`, on main, the build is published as the release of the newest
# version CHANGELOG.md names: the version is never an input.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the build as the release of the newest version in CHANGELOG.md (from main only)"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: windows/amd64
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The version is raised in the pull request that cuts it and only shipped
      # here, once: a publish stops when its tag is there already. A build that
      # is not a publish is v0.0.0, which is no release.
      - name: Resolve the version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          named="$(awk '$1 == "##" && $2 ~ /^\[[0-9]+\.[0-9]+\.[0-9]+\]$/ { print substr($2, 2, length($2) - 2); exit }' CHANGELOG.md)"
          [[ -n "${named}" ]] || { echo "::error::CHANGELOG.md names no version"; exit 1; }
          tags="$(gh api "repos/${GH_REPO}/git/matching-refs/tags/v${named}" --jq "map(select(.ref == \"refs/tags/v${named}\")) | length")"
          echo "CHANGELOG.md names v${named}; tags of that name: ${tags}"
          version="v0.0.0"
          if [[ "${PUBLISH}" == "true" ]]; then
            [[ "${REF}" == "refs/heads/main" ]] || { echo "::error::a release is published from main, not ${REF}"; exit 1; }
            [[ "${tags}" == "0" ]] || { echo "::error::v${named} is released: cut the next version in CHANGELOG.md in a pull request"; exit 1; }
            version="v${named}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          { echo "VERSION=${version}"; echo "NAMED=${named}"; } >> "${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 -shuffle=on ./...

      - name: Drive the built binary
        run: go test -count=1 -tags integration ./cmd/...

      # Go stamps the binary from git. The tag is this checkout's alone until
      # the release is published, and nothing is written here before the build.
      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir dist
          git tag "${VERSION}"
          go build -trimpath -buildvcs=true -o "dist/slopmop-${VERSION}-windows-amd64.exe" ./cmd/slopmop

      # A clone of the tag, built with the same Go, gives the same file.
      - name: Check the stamp
        run: |
          go version -m "dist/slopmop-${VERSION}-windows-amd64.exe" | awk -v version="${VERSION}" -v commit="${GITHUB_SHA}" '
            { sub(/\r$/, ""); print }
            $1 == "mod" && $3 == version { ok++ }
            $1 == "build" && $2 == "vcs.revision=" commit { ok++ }
            $1 == "build" && $2 == "vcs.modified=false" { ok++ }
            END { if (ok != 3) { print "the stamp is not that of " version " at " commit ", unmodified"; exit 1 } }'

      # The file that is published is the file that ran here.
      - name: Run the artefact
        run: |
          exe="dist/slopmop-${VERSION}-windows-amd64.exe"
          "${exe}" --help
          "${exe}" -inputdir internal/evidencetest/testdata/powershell report summary -outdir artefact-check
          grep -q '"tactics"' artefact-check/trace.json
          test -s artefact-check/intents.csv
          grep -q 'Summary' artefact-check/report.txt
          grep -q '^## Summary$' artefact-check/report.md
          grep -q '<h2>Summary</h2>' artefact-check/report.html

      - name: Checksum
        working-directory: dist
        run: |
          sha256sum "slopmop-${VERSION}-windows-amd64.exe" > "slopmop-${VERSION}-windows-amd64.exe.sha256"
          cat "slopmop-${VERSION}-windows-amd64.exe.sha256"
          echo "Built \`slopmop-${VERSION}-windows-amd64.exe\` at \`${GITHUB_SHA}\`: sha256 \`$(cut -d' ' -f1 "slopmop-${VERSION}-windows-amd64.exe.sha256")\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Write the release notes
        run: |
          awk -v v="${NAMED}" '$1 == "##" { on = ($2 == "[" v "]"); next } on' CHANGELOG.md > dist/notes.md
          grep -q '[^[:space:]]' dist/notes.md || { echo "::error::the section of ${NAMED} in CHANGELOG.md is empty"; exit 1; }

      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slopmop-${{ steps.version.outputs.version }}-windows-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # The one job with a token that writes. It runs no code of the repository:
  # the build comes from the job above and is checked against its checksum.
  publish:
    name: publish
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fetch the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slopmop-${{ needs.build.outputs.version }}-windows-amd64
          path: dist

      - name: Check the build
        working-directory: dist
        run: sha256sum -c "slopmop-${VERSION}-windows-amd64.exe.sha256"

      - name: Refuse a version that is released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags="$(gh api "repos/${GH_REPO}/git/matching-refs/tags/${VERSION}" --jq "map(select(.ref == \"refs/tags/${VERSION}\")) | length")"
          [[ "${tags}" == "0" ]] || { echo "::error::${VERSION} is released: cut the next version in CHANGELOG.md in a pull request"; exit 1; }

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/slopmop-${{ needs.build.outputs.version }}-windows-amd64.exe

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${VERSION}" "dist/slopmop-${VERSION}-windows-amd64.exe" "dist/slopmop-${VERSION}-windows-amd64.exe.sha256" --target "${GITHUB_SHA}" --title "slopmop ${VERSION}" --notes-file dist/notes.md
          {
            echo "Published \`${VERSION}\` from \`${GITHUB_SHA}\`"
            echo "- sha256 \`$(cut -d' ' -f1 "dist/slopmop-${VERSION}-windows-amd64.exe.sha256")\`"
            echo "- provenance: \`gh attestation verify slopmop-${VERSION}-windows-amd64.exe -R ${GH_REPO}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
