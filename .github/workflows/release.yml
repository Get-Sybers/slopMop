name: Release

# Publishes the Windows binary as a GitHub release, cut from main by hand.
# A pull request that changes this file rehearses every step but the publish.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; CHANGELOG.md must have its section (e.g. v0.1.0)"
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: windows/amd64
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
      VERSION: ${{ inputs.version || 'v0.0.0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check the request
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REF: ${{ github.ref }}
        run: |
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version '${VERSION}' is not vX.Y.Z"; exit 1; }
          [[ "${REF}" == "refs/heads/main" ]] || { echo "a release is cut from main, not ${REF}"; exit 1; }
          awk -v v="${VERSION#v}" '$1 == "##" { on = ($2 == "[" v "]"); next } on' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "CHANGELOG.md has no section for ${VERSION}"; exit 1; }

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 -shuffle=on ./...

      - name: Drive the built binary
        run: go test -count=1 -tags integration ./cmd/...

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir dist
          go build -trimpath -o "dist/slopmop-${VERSION}-windows-amd64.exe" ./cmd/slopmop

      # The file that is published is the file that ran here.
      - name: Run the artefact
        run: |
          exe="dist/slopmop-${VERSION}-windows-amd64.exe"
          "${exe}" --help
          "${exe}" -inputdir internal/evidencetest/testdata/powershell report summary -outdir artefact-check
          grep -q '"tactics"' artefact-check/trace.json
          grep -q 'Summary' artefact-check/report.txt
          grep -q '^## Summary$' artefact-check/report.md
          grep -q '<h2>Summary</h2>' artefact-check/report.html

      - name: Checksum
        working-directory: dist
        run: |
          sha256sum "slopmop-${VERSION}-windows-amd64.exe" > "slopmop-${VERSION}-windows-amd64.exe.sha256"
          cat "slopmop-${VERSION}-windows-amd64.exe.sha256"

      - name: Publish
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "${VERSION}" dist/*
          --target "${GITHUB_SHA}"
          --title "slopmop ${VERSION}"
          --notes-file notes.md
