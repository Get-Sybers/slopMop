name: Release

# Builds the Windows binary from any branch and keeps it with the run. With
# `publish`, on main, the build is pushed to ghcr.io as the package of the
# newest version CHANGELOG.md names: the version is never an input.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the build as the package of the newest version in CHANGELOG.md (from main only)"
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.sh

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  ORAS_VERSION: "1.3.5"
  ORAS_SHA256: f48a73ea6d026a862c3919fc773da9a8c86fc259c2c737d5baed3b8b9614ad22

jobs:
  build:
    name: windows/amd64
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CGO_ENABLED: "0"
      GOWORK: "off"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The version is raised in the pull request that cuts it and only shipped
      # here, once: a publish stops when its tag is there already. A build that
      # is not a publish is v0.0.0, which is no release.
      - name: Resolve the version
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          named="$(awk '$1 == "##" && $2 ~ /^\[[0-9]+\.[0-9]+\.[0-9]+\]$/ { print substr($2, 2, length($2) - 2); exit }' CHANGELOG.md)"
          [[ -n "${named}" ]] || { echo "::error::CHANGELOG.md names no version"; exit 1; }
          tags="$(gh api "repos/${GH_REPO}/git/matching-refs/tags/v${named}" --jq "map(select(.ref == \"refs/tags/v${named}\")) | length")"
          echo "CHANGELOG.md names v${named}; tags of that name: ${tags}"
          version="v0.0.0"
          if [[ "${PUBLISH}" == "true" ]]; then
            [[ "${REF}" == "refs/heads/main" ]] || { echo "::error::a version is published from main, not ${REF}"; exit 1; }
            [[ "${tags}" == "0" ]] || { echo "::error::v${named} is released: cut the next version in CHANGELOG.md in a pull request"; exit 1; }
            version="v${named}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -count=1 -shuffle=on ./...

      - name: Drive the built binary
        run: go test -count=1 -tags integration ./cmd/...

      # Go stamps the binary from git. The tag is this checkout's alone until
      # the version is published, and nothing is written here before the build.
      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir dist
          git tag "${VERSION}"
          go build -trimpath -buildvcs=true -o "dist/slopmop-${VERSION}-windows-amd64.exe" ./cmd/slopmop

      # A clone of the tag, built with the same Go, gives the same file.
      - name: Check the stamp
        run: |
          go version -m "dist/slopmop-${VERSION}-windows-amd64.exe" | awk -v version="${VERSION}" -v commit="${GITHUB_SHA}" '
            { sub(/\r$/, ""); print }
            $1 == "mod" && $3 == version { ok++ }
            $1 == "build" && $2 == "vcs.revision=" commit { ok++ }
            $1 == "build" && $2 == "vcs.modified=false" { ok++ }
            END { if (ok != 3) { print "the stamp is not that of " version " at " commit ", unmodified"; exit 1 } }'

      # The file that is published is the file that ran here.
      - name: Run the artefact
        run: |
          exe="dist/slopmop-${VERSION}-windows-amd64.exe"
          "${exe}" --help
          "${exe}" -inputdir internal/evidencetest/testdata/powershell report summary -outdir artefact-check
          grep -q '"tactics"' artefact-check/trace.json
          test -s artefact-check/intents.csv
          grep -q 'Summary' artefact-check/report.txt
          grep -q '^## Summary$' artefact-check/report.md
          grep -q '<h2>Summary</h2>' artefact-check/report.html

      - name: Checksum
        working-directory: dist
        run: |
          sha256sum "slopmop-${VERSION}-windows-amd64.exe" > "slopmop-${VERSION}-windows-amd64.exe.sha256"
          cat "slopmop-${VERSION}-windows-amd64.exe.sha256"
          echo "Built \`slopmop-${VERSION}-windows-amd64.exe\` at \`${GITHUB_SHA}\`: sha256 \`$(cut -d' ' -f1 "slopmop-${VERSION}-windows-amd64.exe.sha256")\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slopmop-${{ steps.version.outputs.version }}-windows-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # Packs the build as a publish packs it and pulls it back: every run shows
  # that the package gives the binary out again.
  package:
    name: package
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slopmop-${{ needs.build.outputs.version }}-windows-amd64
          path: dist

      - name: Check the build
        working-directory: dist
        run: sha256sum --check "slopmop-${VERSION}-windows-amd64.exe.sha256"

      - name: Install oras
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  oras_${ORAS_VERSION}_linux_amd64.tar.gz" | sha256sum --check -
          mkdir bin && tar xzf "oras_${ORAS_VERSION}_linux_amd64.tar.gz" -C bin oras
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Pack and pull back
        run: scripts/package.sh dist "${VERSION}" "${RUNNER_TEMP}/layout"

  # The one job with a token that writes, and with the secret of the `release`
  # environment: GHCR_TOKEN, the token it pushes to the registry with.
  publish:
    name: publish
    if: ${{ inputs.publish }}
    needs: [build, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: slopmop-${{ needs.build.outputs.version }}-windows-amd64
          path: dist

      - name: Check the build
        working-directory: dist
        run: sha256sum --check "slopmop-${VERSION}-windows-amd64.exe.sha256"

      - name: Refuse a version that is released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags="$(gh api "repos/${GH_REPO}/git/matching-refs/tags/${VERSION}" --jq "map(select(.ref == \"refs/tags/${VERSION}\")) | length")"
          [[ "${tags}" == "0" ]] || { echo "::error::${VERSION} is released: cut the next version in CHANGELOG.md in a pull request"; exit 1; }

      - name: Install oras
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "${ORAS_SHA256}  oras_${ORAS_VERSION}_linux_amd64.tar.gz" | sha256sum --check -
          mkdir bin && tar xzf "oras_${ORAS_VERSION}_linux_amd64.tar.gz" -C bin oras
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Pack and pull back
        run: scripts/package.sh dist "${VERSION}" "${RUNNER_TEMP}/layout"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/slopmop-${{ needs.build.outputs.version }}-windows-amd64.exe

      # A version is pushed once. One that is there with this binary is left as
      # it is: the run before stopped between the push and the tag.
      - name: Push to the registry
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [[ -n "${GHCR_TOKEN}" ]] || { echo "::error::the release environment holds no GHCR_TOKEN"; exit 1; }
          image="${REGISTRY}/${GH_REPO,,}"
          exe="slopmop-${VERSION}-windows-amd64.exe"
          oras login "${REGISTRY}" --username "${OWNER}" --password-stdin <<<"${GHCR_TOKEN}"
          if oras manifest fetch "${image}:${VERSION}" > "${RUNNER_TEMP}/there.json" 2> /dev/null; then
            there="$(jq -r --arg title "${exe}" '.layers[] | select(.annotations["org.opencontainers.image.title"] == $title) | .digest' "${RUNNER_TEMP}/there.json")"
            [[ "${there}" == "sha256:$(cut -d' ' -f1 "dist/${exe}.sha256")" ]] || { echo "::error::${image}:${VERSION} is there already, with another binary"; exit 1; }
            echo "${image}:${VERSION} is there already, with this binary"
          else
            oras cp --from-oci-layout "${RUNNER_TEMP}/layout:${VERSION}" "${image}:${VERSION}"
          fi
          {
            echo "Published \`${image}:${VERSION}\` from \`${GITHUB_SHA}\`"
            echo "- digest \`$(oras manifest fetch --descriptor "${image}:${VERSION}" | jq -r .digest)\`"
            echo "- fetch: \`oras pull ${image}:${VERSION}\`"
            echo "- provenance: \`gh attestation verify ${exe} -R ${GH_REPO}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Tag the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/${VERSION}" -f "sha=${GITHUB_SHA}" > /dev/null
